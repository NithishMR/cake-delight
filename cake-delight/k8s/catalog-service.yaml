apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-service
  namespace: cake-delight

spec:
  replicas: 1

  selector:
    matchLabels:
      app: catalog-service

  template:
    metadata:
      labels:
        app: catalog-service

    spec:
      containers:
        - name: catalog-service
          image: cake-delight-catalog-service:latest
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 3001

          env:
            - name: PORT
              value: "3001"

            - name: MONGO_URL
              value: "mongodb://mongo-catalog:27017/catalog_db"

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: catalog-service
  namespace: cake-delight

spec:
  selector:
    app: catalog-service

  ports:
    - protocol: TCP
      port: 3001
      targetPort: 3001

  type: ClusterIP