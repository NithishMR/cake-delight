apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo-catalog
  namespace: cake-delight

spec:
  replicas: 1

  selector:
    matchLabels:
      app: mongo-catalog

  template:
    metadata:
      labels:
        app: mongo-catalog

    spec:
      containers:
        - name: mongo-catalog
          image: mongo:8
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 27017

          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          readinessProbe:
            exec:
              command:
                - mongosh
                - --eval
                - "db.adminCommand('ping')"
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5

          livenessProbe:
            exec:
              command:
                - mongosh
                - --eval
                - "db.adminCommand('ping')"
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5

          volumeMounts:
            - name: mongo-catalog-storage
              mountPath: /data/db

      volumes:
        - name: mongo-catalog-storage
          persistentVolumeClaim:
            claimName: mongo-catalog-pvc

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongo-catalog-pvc
  namespace: cake-delight

spec:
  accessModes:
    - ReadWriteOnce

  resources:
    requests:
      storage: 1Gi

---
apiVersion: v1
kind: Service
metadata:
  name: mongo-catalog
  namespace: cake-delight

spec:
  selector:
    app: mongo-catalog

  ports:
    - protocol: TCP
      port: 27017
      targetPort: 27017

  type: ClusterIP