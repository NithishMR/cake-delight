apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: cake-delight

spec:
  replicas: 1

  selector:
    matchLabels:
      app: notification-service

  template:
    metadata:
      labels:
        app: notification-service

    spec:
      containers:
        - name: notification-service
          image: cake-delight-notification-service:latest
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 3004

          env:
            - name: PORT
              value: "3004"

            - name: MONGO_URL
              value: "mongodb://mongo-notification:27017/notification_db"

            - name: RABBITMQ_URL
              value: "amqp://rabbitmq-service:5672"

---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: cake-delight

spec:
  selector:
    app: notification-service

  ports:
    - protocol: TCP
      port: 3004
      targetPort: 3004

  type: ClusterIP