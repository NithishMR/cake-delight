apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: cake-delight

spec:
  replicas: 1

  selector:
    matchLabels:
      app: notification-service

  template:
    metadata:
      labels:
        app: notification-service

    spec:
      containers:
        - name: notification-service
          image: cake-delight-notification-service:latest
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 3004

          env:
            - name: PORT
              value: "3004"

            - name: MONGO_URL
              value: "mongodb://mongo-notification:27017/notification_db"

            - name: RABBITMQ_URL
              value: "amqp://rabbitmq-service:5672"

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          readinessProbe:
            httpGet:
              path: /api/health
              port: 3004
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /api/health
              port: 3004
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: cake-delight

spec:
  selector:
    app: notification-service

  ports:
    - protocol: TCP
      port: 3004
      targetPort: 3004

  type: ClusterIP