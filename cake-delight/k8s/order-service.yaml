apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: cake-delight

spec:
  replicas: 1

  selector:
    matchLabels:
      app: order-service

  template:
    metadata:
      labels:
        app: order-service

    spec:
      containers:
        - name: order-service
          image: cake-delight-order-service:latest
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 3002

          env:
            - name: PORT
              value: "3002"

            - name: MONGO_URL
              value: "mongodb://mongo-order:27017/order_db"

            - name: CATALOG_SERVICE_URL
              value: "http://catalog-service:3001"

            - name: RABBITMQ_URL
              value: "amqp://rabbitmq-service:5672"

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          readinessProbe:
            httpGet:
              path: /api/health
              port: 3002
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /api/health
              port: 3002
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: cake-delight

spec:
  selector:
    app: order-service

  ports:
    - protocol: TCP
      port: 3002
      targetPort: 3002

  type: ClusterIP