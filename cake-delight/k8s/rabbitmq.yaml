apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq-service
  namespace: cake-delight

spec:
  replicas: 1

  selector:
    matchLabels:
      app: rabbitmq-service

  template:
    metadata:
      labels:
        app: rabbitmq-service

    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:management
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 5672
            - containerPort: 15672

---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq-service
  namespace: cake-delight

spec:
  selector:
    app: rabbitmq-service

  ports:
    - name: amqp
      port: 5672
      targetPort: 5672

    - name: management
      port: 15672
      targetPort: 15672

  type: ClusterIP