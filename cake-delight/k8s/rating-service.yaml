apiVersion: apps/v1
kind: Deployment
metadata:
  name: rating-service
  namespace: cake-delight

spec:
  replicas: 1

  selector:
    matchLabels:
      app: rating-service

  template:
    metadata:
      labels:
        app: rating-service

    spec:
      containers:
        - name: rating-service
          image: cake-delight-rating-service:latest
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 3003

          env:
            - name: PORT
              value: "3003"

            - name: MONGO_URL
              value: "mongodb://mongo-rating:27017/rating_db"

            - name: RABBITMQ_URL
              value: "amqp://rabbitmq-service:5672"

---
apiVersion: v1
kind: Service
metadata:
  name: rating-service
  namespace: cake-delight

spec:
  selector:
    app: rating-service

  ports:
    - protocol: TCP
      port: 3003
      targetPort: 3003

  type: ClusterIP